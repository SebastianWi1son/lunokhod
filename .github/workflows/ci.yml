name: CI

# 五件事：
#   ① 开发者视角：一键构建 + 全量测试
#   ② 守护「每个库都能独立构建」这个性质，且测试条数不静默变化
#   ③ 守护「被消费时进入库模式、不泄漏测试可执行文件」这个性质
#   ④ 金标可复现（重跑生成器 → 必须无 diff）
#   ⑤ 文档门禁（把 docs/README.md 的规矩变成机器判）

on:
  push:
    branches: [main, 'dev/**', 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  # ── ⑤ 文档门禁 ────────────────────────────────────────────────────
  # 规矩写在 docs/README.md，实现写在 scripts/check_docs.py。
  # 没有这一步，“文档规矩”就只能靠记性 —— 而它已经因此腐化过一次。
  docs-gate:
    name: 文档门禁（文件头 / 类与位置 / 禁止行号 / 链接与引用存在 / fact 非孤儿）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 检查
        run: python3 scripts/check_docs.py

  # ── ① 一键构建 + 全量测试（对应 README 用法 ①）────────────────────────
  aggregate:
    name: 聚合构建 + 全量测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 工具链版本
        run: |
          cmake --version | head -1
          g++ --version | head -1
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: 编译（-Wall -Wextra -Werror，告警即失败）
        run: cmake --build build -j"$(nproc)"
      - run: ctest --test-dir build --output-on-failure

  # ── ② 每个库单独构建（对应 README 用法 ②）────────────────────────────
  #
  # ⚠ 为什么还多一步“核对测试条数”，而不是只跑 ctest：
  #   contracts 是纯类型库，**一条测试也没有** —— ctest 在无测试时退出码非零。
  #   能忍过去的最简单写法是 --no-tests=ignore，但那会重新打开一个已修过的洞：
  #   2026-09-13 的教训就是 “ctest 报 No tests were found，却靠手跑可执行文件冒充全绿”。
  #   所以把【期望的测试条数】写死，少了 / 多了都红。
  #
  # ⚠ 为什么不用 matrix.include 写（更自然的写法）：
  #   scripts/ci_local.py 只支持 matrix.<key> = [列表] 的笛卡尔积形式，
  #   它看到 include/exclude 会直接跳过（见其 matrix_combos）。
  #   本步要保持“本地能真跑一遍”，所以计数用 case 查表放在脚本里。
  standalone:
    name: 独立构建 / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - contracts
          - kinematics
          - odometry
          - actuator/wheel
          - command/twist_acc_limiter
          - chassis_loop
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S "${{ matrix.component }}" -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build -j"$(nproc)"
      - name: 跑测试并核对条数
        run: |
          case "${{ matrix.component }}" in
            contracts)                 want=0 ;;   # 纯类型库，无测试
            kinematics)                want=3 ;;
            odometry)                  want=1 ;;
            actuator/wheel)             want=2 ;;
            command/twist_acc_limiter) want=5 ;;   # 自身 2 + 引导进来的 kinematics 3
            chassis_loop)              want=1 ;;   # 装配层 7 组测试合成 1 个可执行文件
            *) echo "❌ 矩阵里新增了组件但忘了在这里登记期望条数"; exit 1 ;;
          esac
          # 先数条数再跑 —— 这样 contracts（want=0）不会因 “无测试时 ctest 退非零” 而假红，
          # 而真正有测试的组件仍然不会静默变 0。
          # ⚠ 不能用 grep 'add_test' build/CTestTestfile.cmake 数：
          #   子目录（如引导进来的 kinematics）的测试在 _ext/.../CTestTestfile.cmake 里，
          #   只数根目录那份会漏掉它们（twist_acc_limiter 会数成 2 而不是 5）。
          got=$(ctest --test-dir build -N 2>/dev/null | grep -cE '^ *Test +#' || true)
          echo "注册的测试条数：$got（期望 $want）"
          if [ "$got" -ne "$want" ]; then
            echo "❌ 测试条数不对 —— 少了=测试被静默丢掉；多了=有预期外的 target 被挂上"
            exit 1
          fi
          if [ "$got" -gt 0 ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "（本组件无测试，已跳过 ctest —— 这是预期的）"
          fi

  # ── ③ 库模式：被消费时只出库，不生成测试/示例（对应 README 用法 ③）──────
  consumer-mode:
    name: 库模式（被消费时不泄漏测试可执行文件）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 写一个最小消费者工程
        run: |
          mkdir -p /tmp/consumer
          # 注意：heredoc 用【引号形式】<<'EOF' —— 不做 shell 展开。
          #           曾经写成 \${GITHUB_WORKSPACE}，结果 bash 把反斜杠转义成字面量，
          #           CMake 把 ${...} 当未定义变量展开成空 → 路径变成 "/control/..."。
          #           现在路径改由 -DLUNOKHOD_ROOT=... 传入。
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          if(NOT LUNOKHOD_ROOT)
            message(FATAL_ERROR "请传 -DLUNOKHOD_ROOT=<lunokhod 根目录>")
          endif()
          add_subdirectory(${LUNOKHOD_ROOT}/contracts ext/contracts)
          add_subdirectory(${LUNOKHOD_ROOT}/kinematics ext/kinematics)
          add_subdirectory(${LUNOKHOD_ROOT}/odometry ext/odometry)
          add_subdirectory(${LUNOKHOD_ROOT}/actuator/wheel ext/wheel)
          add_subdirectory(${LUNOKHOD_ROOT}/command/twist_acc_limiter ext/tal)
          add_subdirectory(${LUNOKHOD_ROOT}/chassis_loop ext/chassis_loop)
          add_executable(app main.cpp)
          target_compile_options(app PRIVATE -Wall -Wextra -Werror)
          target_link_libraries(app PRIVATE contracts kinematics odometry wheel twist_acc_limiter chassis_loop)
          EOF
          cat > /tmp/consumer/main.cpp <<'EOF'
          #include "chassis.hpp"
          #include "wheel_set.hpp"          // 执行器组（它自带 chassis_loop.hpp）
          #include "odometry.hpp"
          #include "twist_acc_limiter.hpp"
          #include "wheel.hpp"
          // 命名空间（2026-09-17）：全仓类型在 lunokhod:: 之下（见 AGENTS.md §3）
          using namespace lunokhod;                    // Twist / WheelSpeeds / Pose
          using namespace lunokhod::kinematics;        // MecanumDrive
          using namespace lunokhod::twist_acc_limiter; // TwistAccLimiter
          using namespace lunokhod::odometry;          // Odometry
          using namespace lunokhod::chassis_loop;      // ChassisLoop / WheelSet / WheelLoop
          static float fake_measure(uint8_t wheel_id, float dt) { (void)wheel_id; (void)dt; return 0.0f; }
          static void  fake_effort(uint8_t wheel_id, int16_t effort) { (void)wheel_id; (void)effort; }
          int main() {
              MecanumDrive    chassis(0.10f, 0.12f, 0.03f);
              TwistAccLimiter limiter(1.5f, 1.5f, 4.0f);
              Odometry        odom;
              (void)chassis.inverse_kinematics(Twist{0.5f, 0.0f, 0.0f});
              (void)limiter.limit(Twist{0.5f, 0.0f, 0.0f}, 0.001f);
              odom.update(Twist{0.5f, 0.0f, 0.0f}, 0.001f, 1u);
              // 装配层（接缝版）：被消费时能真用起来
              ChassisLoopConfig cfg;
              WheelSetConfig    wcfg;
              WheelLoop<MecanumDrive> loop(cfg, WheelSet<MecanumDrive>(wcfg, chassis, fake_measure, fake_effort));
              loop.set_cmd(Twist{0.3f, 0.0f, 0.0f});
              loop.tick(0.001f, 2u);
              return (loop.wheel_target(0) > 0.0f) ? 0 : 1;
          }
          EOF
      - name: 配置 + 编译
        run: |
          cmake -S /tmp/consumer -B /tmp/consumer/build -DLUNOKHOD_ROOT="$GITHUB_WORKSPACE"
          cmake --build /tmp/consumer/build -j"$(nproc)"
      - name: 断言库模式干净（没有 test_* / example_* 可执行文件）
        run: |
          leaked=$(find /tmp/consumer/build -type f -executable \
                     \( -name 'test_*' -o -name 'example_*' -o -name 'odometry_demo' \) || true)
          if [ -n "$leaked" ]; then
            echo "❌ 库模式泄漏了开发期可执行文件："
            echo "$leaked"
            exit 1
          fi
          echo "✅ 库模式干净：只出了库，没出测试/示例/工具"

  # ── ④ 金标可复现 ──────────────────────────────────────────────────
  golden-reproducible:
    name: 金标可复现（重跑生成器 → 必须无 diff）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装 oracle 依赖（金标靠第三方库交叉验证）
        # ⚠ 锁版本：金标是【逐字节比对】的，不同 numpy/scipy 底下的 libm
        #   可能给出末位差异 → 会变成随机红的 flaky job。
        #   此处锁定的是作者本地已验证过的版本；升级需同时重生金标并改这里。
        run: pip install numpy==1.26.4 scipy==1.11.4 sympy==1.12
      - name: 重新生成金标（生成器内部有五重自检，失败会直接退出）
        run: python3 odometry/test/tools/gen_odometry_golden.py
      - name: 与仓库里的文件比对 —— 有 diff 说明金标被手改过或生成器飘了
        run: git diff --exit-code odometry/test/odometry_golden.hpp
